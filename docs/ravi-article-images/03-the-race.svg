<svg width="1600" height="560" viewBox="0 0 1600 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1600" height="560" fill="#ffffff"/>
  <text x="40" y="50" font-size="26" font-weight="700" fill="#052e16">The race: same email, three suppliers</text>
  <text x="40" y="78" font-size="14" fill="#4b6355">About 78% of B2B buyers pick the first vendor with a credible proposal. Timeline not to scale.</text>

  <line x1="260" y1="470" x2="1560" y2="470" stroke="#86efac" stroke-width="2"/>
  <g font-size="13" fill="#166534" text-anchor="middle">
    <line x1="300" y1="462" x2="300" y2="478" stroke="#166534"/><text x="300" y="500">Thu 5:40 pm</text>
    <line x1="520" y1="462" x2="520" y2="478" stroke="#166534"/><text x="520" y="500">Thu 5:52 pm</text>
    <line x1="860" y1="462" x2="860" y2="478" stroke="#166534"/><text x="860" y="500">Fri 9:05 am</text>
    <line x1="1160" y1="462" x2="1160" y2="478" stroke="#166534"/><text x="1160" y="500">Fri 11:20 am</text>
    <line x1="1460" y1="462" x2="1460" y2="478" stroke="#166534"/><text x="1460" y="500">Fri 3:45 pm</text>
  </g>
  <line x1="690" y1="455" x2="705" y2="485" stroke="#86efac" stroke-width="2"/><line x1="700" y1="455" x2="715" y2="485" stroke="#86efac" stroke-width="2"/>
  <text x="702" y="520" font-size="12" text-anchor="middle" fill="#4b6355">overnight</text>

  <text x="40" y="160" font-size="16" font-weight="700" fill="#14532d">Northline</text>
  <text x="40" y="180" font-size="12" fill="#4b6355">quoting agent</text>
  <text x="40" y="290" font-size="16" font-weight="700" fill="#4b5563">Supplier B</text>
  <text x="40" y="310" font-size="12" fill="#6b7280">manual quoting</text>
  <text x="40" y="400" font-size="16" font-weight="700" fill="#4b5563">Supplier C</text>
  <text x="40" y="420" font-size="12" fill="#6b7280">manual quoting</text>
  <line x1="260" y1="230" x2="1560" y2="230" stroke="#e5e7eb"/><line x1="260" y1="350" x2="1560" y2="350" stroke="#e5e7eb"/>

  <rect x="300" y="150" width="220" height="30" rx="15" fill="#22c55e"/>
  <text x="410" y="170" font-size="13" text-anchor="middle" font-weight="700" fill="#ffffff">12 minutes</text>
  <rect x="530" y="130" width="255" height="70" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="545" y="155" font-size="13" font-weight="700" fill="#14532d">Estimate sent: $21,080</text>
  <text x="545" y="175" font-size="12" fill="#166534">substitute swapped, carrier added,</text>
  <text x="545" y="191" font-size="12" fill="#166534">wrong discount blocked</text>
  <rect x="800" y="130" width="120" height="70" rx="10" fill="#166534"/>
  <text x="860" y="160" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff">Ravi</text>
  <text x="860" y="180" font-size="14" text-anchor="middle" font-weight="700" fill="#ffffff">books</text>

  <rect x="300" y="280" width="860" height="26" rx="13" fill="#e5e7eb"/>
  <text x="730" y="298" font-size="12" text-anchor="middle" fill="#4b5563">waiting for a rep to open the email, key in lines, check stock and discounts</text>
  <rect x="1170" y="275" width="240" height="36" rx="8" fill="#fff" stroke="#9ca3af"/>
  <text x="1290" y="298" font-size="13" text-anchor="middle" fill="#4b5563">Quote sent. Job already booked.</text>

  <rect x="300" y="390" width="1160" height="26" rx="13" fill="#e5e7eb"/>
  <text x="880" y="408" font-size="12" text-anchor="middle" fill="#4b5563">same manual process, plus a supplier call about the discontinued sink</text>
  <text x="1470" y="408" font-size="13" fill="#4b5563">Too late</text>
</svg>
