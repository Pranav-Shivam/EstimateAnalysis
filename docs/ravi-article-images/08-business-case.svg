<svg width="1600" height="940" viewBox="0 0 1600 940" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#166534" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
  <rect width="1600" height="940" fill="#fff"/>
  <text x="40" y="50" font-size="26" font-weight="700" fill="#052e16">What one year looks like at a 200-quote-a-day distributor</text>
  <text x="40" y="76" font-size="14" fill="#4b6355">Worked example. Swap in your own numbers: the math is in the article.</text>

  <!-- turnaround banner -->
  <rect x="40" y="100" width="1520" height="110" rx="14" fill="#052e16"/>
  <text x="80" y="145" font-size="15" fill="#86efac" font-weight="700">MEDIAN QUOTE TURNAROUND</text>
  <text x="80" y="188" font-size="36" font-weight="700" fill="#ffffff">13 to 14 hours</text>
  <line x1="420" y1="175" x2="560" y2="175" stroke="#4ade80" stroke-width="3" marker-end="url(#a)"/>
  <text x="590" y="188" font-size="36" font-weight="700" fill="#4ade80">minutes</text>
  <text x="900" y="150" font-size="14" fill="#bbf7d0">About 78% of B2B buyers pick the first vendor</text>
  <text x="900" y="172" font-size="14" fill="#bbf7d0">with a credible proposal. Distributors lose over 40%</text>
  <text x="900" y="194" font-size="14" fill="#bbf7d0">of potential wins when quotes take more than 24 hours.</text>

  <!-- 4 value cards -->
  <g>
    <rect x="40" y="235" width="365" height="250" rx="14" fill="#166534"/>
    <text x="64" y="272" font-size="14" font-weight="700" fill="#86efac">CAPACITY</text>
    <text x="64" y="325" font-size="40" font-weight="700" fill="#fff">36,000</text>
    <text x="64" y="352" font-size="15" fill="#dcfce7">rep hours back per year</text>
    <text x="64" y="395" font-size="13" fill="#bbf7d0">about 18 full-time reps moved from</text>
    <text x="64" y="414" font-size="13" fill="#bbf7d0">keying in line items to selling</text>
    <text x="64" y="458" font-size="15" font-weight="700" fill="#fff">about $1.6M of capacity</text>
  </g>
  <g>
    <rect x="425" y="235" width="365" height="250" rx="14" fill="#15803d"/>
    <text x="449" y="272" font-size="14" font-weight="700" fill="#bbf7d0">WIN RATE</text>
    <text x="449" y="325" font-size="40" font-weight="700" fill="#fff">+$10.2M</text>
    <text x="449" y="352" font-size="15" fill="#dcfce7">revenue from +3 points of win rate</text>
    <text x="449" y="395" font-size="13" fill="#dcfce7">first credible quote, every time,</text>
    <text x="449" y="414" font-size="13" fill="#dcfce7">including nights and weekends</text>
    <text x="449" y="458" font-size="15" font-weight="700" fill="#fff">about $2M gross profit</text>
  </g>
  <g>
    <rect x="810" y="235" width="365" height="250" rx="14" fill="#16a34a"/>
    <text x="834" y="272" font-size="14" font-weight="700" fill="#dcfce7">MARGIN + ORDER SIZE</text>
    <text x="834" y="325" font-size="40" font-weight="700" fill="#fff">$740k</text>
    <text x="834" y="352" font-size="15" fill="#f0fdf4">kept and added per year</text>
    <text x="834" y="395" font-size="13" fill="#f0fdf4">$380k of wrong discounts blocked</text>
    <text x="834" y="414" font-size="13" fill="#f0fdf4">$360k of forgotten parts sold</text>
    <text x="834" y="458" font-size="15" font-weight="700" fill="#fff">plus fewer returns and callbacks</text>
  </g>
  <g>
    <rect x="1195" y="235" width="365" height="250" rx="14" fill="#22c55e"/>
    <text x="1219" y="272" font-size="14" font-weight="700" fill="#f0fdf4">DEDUPE</text>
    <text x="1219" y="325" font-size="40" font-weight="700" fill="#fff">7,500</text>
    <text x="1219" y="352" font-size="15" fill="#f0fdf4">duplicate or revised emails a year</text>
    <text x="1219" y="395" font-size="13" fill="#f0fdf4">answered without a full agent run,</text>
    <text x="1219" y="414" font-size="13" fill="#f0fdf4">one price per job, honest pipeline</text>
    <text x="1219" y="458" font-size="15" font-weight="700" fill="#fff">no conflicting quotes</text>
  </g>

  <!-- where to invest -->
  <text x="40" y="535" font-size="18" font-weight="700" fill="#14532d">Where to invest, in this order</text>
  <g font-size="13">
    <rect x="40" y="555" width="290" height="175" rx="12" fill="#f7fee7" stroke="#65a30d" stroke-width="1.4"/>
    <circle cx="68" cy="584" r="14" fill="#052e16"/><text x="68" y="589" text-anchor="middle" font-weight="700" fill="#fff">1</text>
    <text x="92" y="590" font-size="15" font-weight="700" fill="#365314">Your data</text>
    <text x="58" y="622" fill="#3f6212">clean catalog and price book</text>
    <text x="58" y="642" fill="#3f6212">one customer master</text>
    <text x="58" y="662" fill="#3f6212">contracts as data, not PDFs</text>
    <text x="58" y="700" font-size="12" font-weight="700" fill="#4d7c0f">most of the effort lives here</text>

    <rect x="345" y="555" width="290" height="175" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
    <circle cx="373" cy="584" r="14" fill="#052e16"/><text x="373" y="589" text-anchor="middle" font-weight="700" fill="#fff">2</text>
    <text x="397" y="590" font-size="15" font-weight="700" fill="#065f46">Intake + dedupe</text>
    <text x="363" y="622" fill="#047857">email and attachment parsing</text>
    <text x="363" y="642" fill="#047857">structured quote requests</text>
    <text x="363" y="662" fill="#047857">catch duplicates before work</text>
    <text x="363" y="700" font-size="12" font-weight="700" fill="#047857">fastest payback</text>

    <rect x="650" y="555" width="290" height="175" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
    <circle cx="678" cy="584" r="14" fill="#052e16"/><text x="678" y="589" text-anchor="middle" font-weight="700" fill="#fff">3</text>
    <text x="702" y="590" font-size="15" font-weight="700" fill="#065f46">Agent + pricing</text>
    <text x="668" y="622" fill="#047857">tools into ERP, CRM, stock</text>
    <text x="668" y="642" fill="#047857">pricing rules as skills</text>
    <text x="668" y="662" fill="#047857">hard guardrails on discounts</text>
    <text x="668" y="700" font-size="12" font-weight="700" fill="#047857">first draft estimates</text>

    <rect x="955" y="555" width="290" height="175" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
    <circle cx="983" cy="584" r="14" fill="#052e16"/><text x="983" y="589" text-anchor="middle" font-weight="700" fill="#fff">4</text>
    <text x="1007" y="590" font-size="15" font-weight="700" fill="#065f46">Evals + review</text>
    <text x="973" y="622" fill="#047857">confidence score per quote</text>
    <text x="973" y="642" fill="#047857">review screen that shows why</text>
    <text x="973" y="662" fill="#047857">traces, gates, safe releases</text>
    <text x="973" y="700" font-size="12" font-weight="700" fill="#047857">what makes auto-send safe</text>

    <rect x="1260" y="555" width="300" height="175" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <circle cx="1288" cy="584" r="14" fill="#052e16"/><text x="1288" y="589" text-anchor="middle" font-weight="700" fill="#fff">5</text>
    <text x="1312" y="590" font-size="15" font-weight="700" fill="#14532d">Knowledge graph</text>
    <text x="1278" y="622" fill="#166534">substitutes, required parts</text>
    <text x="1278" y="642" fill="#166534">contract coverage, people</text>
    <text x="1278" y="662" fill="#166534">every correction becomes an edge</text>
    <text x="1278" y="700" font-size="12" font-weight="700" fill="#15803d">what makes it stop repeating mistakes</text>
  </g>
  <line x1="330" y1="642" x2="343" y2="642" stroke="#166534" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="635" y1="642" x2="648" y2="642" stroke="#166534" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="940" y1="642" x2="953" y2="642" stroke="#166534" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="1245" y1="642" x2="1258" y2="642" stroke="#166534" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- metrics -->
  <rect x="40" y="755" width="1520" height="95" rx="12" fill="#f0fdf4" stroke="#bbf7d0"/>
  <text x="64" y="785" font-size="14" font-weight="700" fill="#14532d">Track these 7 numbers from day one</text>
  <g font-size="13" fill="#166534">
    <text x="64" y="815">median turnaround</text><text x="264" y="815">auto-send rate</text><text x="434" y="815">correction rate after send</text>
    <text x="664" y="815">win rate</text><text x="784" y="815">duplicate rate</text><text x="934" y="815">false merge rate</text><text x="1104" y="815">cost per quote</text>
  </g>
  <text x="64" y="838" font-size="12" fill="#4b6355">If you can't measure the first four today, that's step zero.</text>

  <text x="40" y="890" font-size="12" fill="#4b6355">Assumptions: 200 quote emails a day, 250 selling days, $8,000 average quote, 25% base win rate, 45 minutes manual handling, $45/hour loaded rep cost,</text>
  <text x="40" y="908" font-size="12" fill="#4b6355">15% duplicates or revisions, 80% auto-send, 3% of quotes with a pricing error ($300 average), 5% with a missed required part ($600 average), 20% gross margin.</text>
</svg>
