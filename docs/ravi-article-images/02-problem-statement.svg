<svg width="1700" height="1010" viewBox="0 0 1700 1010" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#334155" stroke-width="1.6" stroke-linecap="round"/></marker></defs>
  <rect width="1700" height="1010" fill="#fff"/>
  <text x="40" y="50" font-size="26" font-weight="700" fill="#052e16">The problem: a quote desk that can't keep up</text>
  <text x="40" y="78" font-size="14.5" fill="#4b6355">Turning a free-text quote email into a correct, priced estimate takes a skilled person most of an hour, and the knowledge to get it right lives in people's heads.</text>

  <!-- INBOX -->
  <rect x="40" y="105" width="400" height="330" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="62" y="136" font-size="15" font-weight="700" fill="#1e293b">The inbox</text>
  <text x="418" y="136" font-size="15" font-weight="700" text-anchor="end" fill="#b91c1c">200 a day</text>
  <g font-size="12" font-style="italic" fill="#334155">
    <rect x="60" y="152" width="360" height="46" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="74" y="180">"need 40 WM faucets + 12 sinks, hotel job"</text>
    <rect x="60" y="206" width="360" height="46" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="74" y="234">"pls quote the attached list" (scanned PDF)</text>
    <rect x="60" y="260" width="360" height="46" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="74" y="288">"same as last time but 16 gauge"</text>
    <rect x="60" y="314" width="360" height="46" rx="8" fill="#fef2f2" stroke="#fca5a5"/><text x="74" y="342" fill="#991b1b">"pricing for Hotel Harbor, 14 Harbour Rd"</text>
  </g>
  <text x="62" y="386" font-size="12.5" fill="#475569">no part numbers, no format, attachments,</text>
  <text x="62" y="404" font-size="12.5" fill="#475569">and some are the same job in disguise</text>

  <line x1="440" y1="270" x2="478" y2="270" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- MANUAL PROCESS -->
  <rect x="480" y="105" width="560" height="330" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="502" y="136" font-size="15" font-weight="700" fill="#1e293b">One skilled rep, by hand</text>
  <text x="1018" y="136" font-size="15" font-weight="700" text-anchor="end" fill="#b91c1c">about 45 min each</text>
  <g font-size="13">
    <rect x="500" y="154" width="520" height="36" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="516" y="177" fill="#1e293b">Read the email, work out what they mean</text><text x="1004" y="177" text-anchor="end" fill="#64748b">5 min</text>
    <rect x="500" y="198" width="520" height="36" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="516" y="221" fill="#1e293b">Find each part in the catalog</text><text x="1004" y="221" text-anchor="end" fill="#64748b">10 min</text>
    <rect x="500" y="242" width="520" height="36" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="516" y="265" fill="#1e293b">Check stock, chase substitutes for discontinued items</text><text x="1004" y="265" text-anchor="end" fill="#64748b">12 min</text>
    <rect x="500" y="286" width="520" height="36" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="516" y="309" fill="#1e293b">Check the contract: which discount applies to what</text><text x="1004" y="309" text-anchor="end" fill="#64748b">8 min</text>
    <rect x="500" y="330" width="520" height="36" rx="8" fill="#fff" stroke="#e2e8f0"/><text x="516" y="353" fill="#1e293b">Price it, remember the parts they forgot, build the quote</text><text x="1004" y="353" text-anchor="end" fill="#64748b">10 min</text>
  </g>
  <text x="502" y="394" font-size="12.5" fill="#475569">150 rep hours a day. Accuracy depends on who picks it up,</text>
  <text x="502" y="412" font-size="12.5" fill="#475569">and whether they've seen this problem before.</text>

  <line x1="1040" y1="270" x2="1078" y2="270" stroke="#334155" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- OUTCOME -->
  <rect x="1080" y="105" width="580" height="330" rx="14" fill="#1e293b"/>
  <text x="1104" y="138" font-size="14" font-weight="700" fill="#fca5a5">WHAT THE CUSTOMER SEES</text>
  <text x="1104" y="196" font-size="17" fill="#e2e8f0">Median quote turnaround</text>
  <text x="1104" y="246" font-size="46" font-weight="700" fill="#ffffff">13 to 14 hours</text>
  <line x1="1104" y1="274" x2="1636" y2="274" stroke="#475569"/>
  <text x="1104" y="312" font-size="30" font-weight="700" fill="#4ade80">78%</text>
  <text x="1190" y="306" font-size="13.5" fill="#e2e8f0">of B2B buyers pick the first vendor</text>
  <text x="1190" y="324" font-size="13.5" fill="#e2e8f0">with a credible proposal</text>
  <text x="1104" y="378" font-size="30" font-weight="700" fill="#fca5a5">40%+</text>
  <text x="1190" y="372" font-size="13.5" fill="#e2e8f0">of potential wins lost when a quote</text>
  <text x="1190" y="390" font-size="13.5" fill="#e2e8f0">takes longer than 24 hours</text>

  <!-- FOUR FAILURES -->
  <text x="40" y="480" font-size="18" font-weight="700" fill="#14532d">One problem, four symptoms</text>
  <g>
    <rect x="40" y="495" width="395" height="235" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
    <text x="62" y="530" font-size="13" font-weight="700" fill="#b91c1c">1  SLOW</text>
    <text x="62" y="562" font-size="17" font-weight="700" fill="#7f1d1d">Quotes sit overnight</text>
    <text x="62" y="592" font-size="13" fill="#991b1b">45 minutes each, 200 a day</text>
    <text x="62" y="612" font-size="13" fill="#991b1b">nights and weekends pile up</text>
    <text x="62" y="632" font-size="13" fill="#991b1b">the first credible quote usually wins</text>
    <line x1="62" y1="660" x2="413" y2="660" stroke="#fecaca"/>
    <text x="62" y="690" font-size="13" font-weight="700" fill="#7f1d1d">Cost: jobs lost to faster</text>
    <text x="62" y="708" font-size="13" font-weight="700" fill="#7f1d1d">competitors</text>
  </g>
  <g>
    <rect x="455" y="495" width="395" height="235" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
    <text x="477" y="530" font-size="13" font-weight="700" fill="#b91c1c">2  WRONG</text>
    <text x="477" y="562" font-size="17" font-weight="700" fill="#7f1d1d">Mistakes hide in the data</text>
    <text x="477" y="592" font-size="13" fill="#991b1b">discontinued items</text>
    <text x="477" y="612" font-size="13" fill="#991b1b">required parts nobody asked for</text>
    <text x="477" y="632" font-size="13" fill="#991b1b">discounts on the wrong category</text>
    <line x1="477" y1="660" x2="828" y2="660" stroke="#fecaca"/>
    <text x="477" y="690" font-size="13" font-weight="700" fill="#7f1d1d">Cost: margin leaks, returns,</text>
    <text x="477" y="708" font-size="13" font-weight="700" fill="#7f1d1d">failed installs, credit notes</text>
  </g>
  <g>
    <rect x="870" y="495" width="395" height="235" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
    <text x="892" y="530" font-size="13" font-weight="700" fill="#b91c1c">3  DUPLICATED</text>
    <text x="892" y="562" font-size="17" font-weight="700" fill="#7f1d1d">Same job, quoted twice</text>
    <text x="892" y="592" font-size="13" fill="#991b1b">two people, two branches, or a resend</text>
    <text x="892" y="612" font-size="13" fill="#991b1b">exact match misses reworded copies</text>
    <text x="892" y="632" font-size="13" fill="#991b1b">loose match mistakes revisions for copies</text>
    <line x1="892" y1="660" x2="1243" y2="660" stroke="#fecaca"/>
    <text x="892" y="690" font-size="13" font-weight="700" fill="#7f1d1d">Cost: double work, two prices to</text>
    <text x="892" y="708" font-size="13" font-weight="700" fill="#7f1d1d">one customer, inflated pipeline</text>
  </g>
  <g>
    <rect x="1285" y="495" width="375" height="235" rx="14" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.4"/>
    <text x="1307" y="530" font-size="13" font-weight="700" fill="#b91c1c">4  FORGETFUL</text>
    <text x="1307" y="562" font-size="17" font-weight="700" fill="#7f1d1d">Fixes don't stick</text>
    <text x="1307" y="592" font-size="13" fill="#991b1b">a correction lives in one quote</text>
    <text x="1307" y="612" font-size="13" fill="#991b1b">the next rep repeats the mistake</text>
    <text x="1307" y="632" font-size="13" fill="#991b1b">knowledge leaves when people do</text>
    <line x1="1307" y1="660" x2="1638" y2="660" stroke="#fecaca"/>
    <text x="1307" y="690" font-size="13" font-weight="700" fill="#7f1d1d">Cost: the same errors,</text>
    <text x="1307" y="708" font-size="13" font-weight="700" fill="#7f1d1d">forever</text>
  </g>

  <!-- REQUIREMENTS -->
  <text x="40" y="780" font-size="18" font-weight="700" fill="#14532d">What a solution has to do</text>
  <g font-size="13">
    <rect x="40" y="795" width="310" height="120" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
    <text x="60" y="826" font-weight="700" fill="#065f46" font-size="14">Read anything</text>
    <text x="60" y="850" fill="#047857">any email or attachment,</text>
    <text x="60" y="868" fill="#047857">into a structured request</text>
    <text x="60" y="900" font-size="12" font-weight="700" fill="#15803d">intake + agent loop</text>

    <rect x="370" y="795" width="310" height="120" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
    <text x="390" y="826" font-weight="700" fill="#065f46" font-size="14">Catch duplicates first</text>
    <text x="390" y="850" fill="#047857">copies and revisions spotted</text>
    <text x="390" y="868" fill="#047857">before any work starts</text>
    <text x="390" y="900" font-size="12" font-weight="700" fill="#15803d">dedupe agent</text>

    <rect x="700" y="795" width="310" height="120" rx="12" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
    <text x="720" y="826" font-weight="700" fill="#14532d" font-size="14">Get relationships right</text>
    <text x="720" y="850" fill="#166534">substitutes, required parts,</text>
    <text x="720" y="868" fill="#166534">contract coverage</text>
    <text x="720" y="900" font-size="12" font-weight="700" fill="#15803d">knowledge graph</text>

    <rect x="1030" y="795" width="310" height="120" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="1.4"/>
    <text x="1050" y="826" font-weight="700" fill="#065f46" font-size="14">Know when it's unsure</text>
    <text x="1050" y="850" fill="#047857">auto-send the confident ones,</text>
    <text x="1050" y="868" fill="#047857">ask a person the right question</text>
    <text x="1050" y="900" font-size="12" font-weight="700" fill="#15803d">eval + human in the loop</text>

    <rect x="1360" y="795" width="300" height="120" rx="12" fill="#22c55e"/>
    <text x="1380" y="826" font-weight="700" fill="#fff" font-size="14">Never repeat a mistake</text>
    <text x="1380" y="850" fill="#f0fdf4">every correction is remembered</text>
    <text x="1380" y="868" fill="#f0fdf4">and every release is tested</text>
    <text x="1380" y="900" font-size="12" font-weight="700" fill="#fff">memory + LLMOps</text>
  </g>
  <text x="40" y="965" font-size="13" fill="#4b6355">Symptom 1 is solved by speed. Symptoms 2, 3, and 4 are only solved by a system that knows how your business connects. That's the rest of this article.</text>
</svg>
