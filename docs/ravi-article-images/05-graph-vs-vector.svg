<svg width="1600" height="760" viewBox="0 0 1600 760" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#166534" stroke-width="1.6" stroke-linecap="round"/></marker>
    <marker id="r" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1L8 5L1 9" fill="none" stroke="#b91c1c" stroke-width="1.6" stroke-linecap="round"/></marker>
  </defs>
  <rect width="1600" height="760" fill="#fff"/>
  <text x="40" y="50" font-size="26" font-weight="700" fill="#052e16">Vector search finds facts. The graph connects them.</text>
  <text x="40" y="78" font-size="14" fill="#4b6355">Same question for both: "Price Ravi's order correctly."</text>

  <rect x="40" y="110" width="440" height="610" rx="16" fill="#f9fafb" stroke="#d1d5db"/>
  <text x="64" y="145" font-size="17" font-weight="700" fill="#374151">Vector search returns</text>
  <text x="64" y="166" font-size="12.5" fill="#6b7280">top-k chunks, each correct, none connected</text>
  <g font-size="12.5" fill="#374151">
    <rect x="64" y="190" width="392" height="80" rx="8" fill="#fff" stroke="#d1d5db"/>
    <text x="80" y="215" font-weight="700">Chunk 1: product notice</text><text x="80" y="236">"SKU 2240 replaces the discontinued 2210</text><text x="80" y="254">in the steel sink line."</text>
    <rect x="64" y="285" width="392" height="80" rx="8" fill="#fff" stroke="#d1d5db"/>
    <text x="80" y="310" font-weight="700">Chunk 2: customer contract</text><text x="80" y="331">"Ravi Construction receives 8% on</text><text x="80" y="349">covered categories."</text>
    <rect x="64" y="380" width="392" height="80" rx="8" fill="#fff" stroke="#d1d5db"/>
    <text x="80" y="405" font-weight="700">Chunk 3: install guide</text><text x="80" y="426">"Wall-mount faucets are installed on a</text><text x="80" y="444">concealed carrier."</text>
  </g>
  <rect x="64" y="490" width="392" height="200" rx="10" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="80" y="518" font-size="14" font-weight="700" fill="#991b1b">What the model does with them</text>
  <text x="80" y="546" font-size="12.5" fill="#991b1b">Swaps in 2240. Good.</text>
  <text x="80" y="570" font-size="12.5" fill="#991b1b">Applies 8% to it. Wrong: 2240 is in a</text>
  <text x="80" y="588" font-size="12.5" fill="#991b1b">category the contract doesn't cover.</text>
  <text x="80" y="612" font-size="12.5" fill="#991b1b">Skips the carrier. "Installed on a carrier"</text>
  <text x="80" y="630" font-size="12.5" fill="#991b1b">never became "add a carrier to the order."</text>
  <text x="80" y="668" font-size="13" font-weight="700" fill="#991b1b">Fast, confident, and $2,474 off.</text>

  <rect x="520" y="110" width="1040" height="610" rx="16" fill="#f0fdf4" stroke="#15803d" stroke-width="1.6"/>
  <text x="544" y="145" font-size="17" font-weight="700" fill="#14532d">Graph traversal returns</text>
  <text x="544" y="166" font-size="12.5" fill="#166534">connected facts plus the path that proves each answer</text>

  <g font-size="13" text-anchor="middle">
    <rect x="560" y="200" width="200" height="60" rx="10" fill="#166534"/><text x="660" y="235" font-weight="700" fill="#fff">Ravi Construction</text>
    <rect x="840" y="200" width="200" height="60" rx="10" fill="#fff" stroke="#15803d" stroke-width="1.4"/><text x="940" y="226" font-weight="700" fill="#14532d">Contract</text><text x="940" y="245" font-size="12" fill="#166534">8% discount</text>
    <rect x="1120" y="200" width="200" height="60" rx="10" fill="#fff" stroke="#15803d" stroke-width="1.4"/><text x="1220" y="235" font-weight="700" fill="#14532d">Category A</text>

    <rect x="560" y="340" width="200" height="60" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-dasharray="4 3"/><text x="660" y="366" font-weight="700" fill="#991b1b">SKU 2210</text><text x="660" y="385" font-size="12" fill="#991b1b">discontinued</text>
    <rect x="840" y="340" width="200" height="60" rx="10" fill="#fff" stroke="#15803d" stroke-width="1.4"/><text x="940" y="366" font-weight="700" fill="#14532d">SKU 2240</text><text x="940" y="385" font-size="12" fill="#166534">approved substitute</text>
    <rect x="1120" y="340" width="200" height="60" rx="10" fill="#fff" stroke="#15803d" stroke-width="1.4"/><text x="1220" y="375" font-weight="700" fill="#14532d">Category B</text>

    <rect x="560" y="480" width="200" height="60" rx="10" fill="#fff" stroke="#15803d" stroke-width="1.4"/><text x="660" y="506" font-weight="700" fill="#14532d">Wall-mount faucet</text><text x="660" y="525" font-size="12" fill="#166534">x 40</text>
    <rect x="840" y="480" width="200" height="60" rx="10" fill="#22c55e"/><text x="940" y="506" font-weight="700" fill="#fff">Carrier-7</text><text x="940" y="525" font-size="12" fill="#f0fdf4">x 40, not requested</text>
  </g>
  <g font-size="11.5" fill="#166534" text-anchor="middle">
    <line x1="760" y1="230" x2="838" y2="230" stroke="#166534" stroke-width="1.8" marker-end="url(#a)"/><text x="800" y="221">HOLDS</text>
    <line x1="1040" y1="230" x2="1118" y2="230" stroke="#166534" stroke-width="1.8" marker-end="url(#a)"/><text x="1080" y="221">COVERS</text>
    <line x1="760" y1="370" x2="838" y2="370" stroke="#166534" stroke-width="1.8" marker-end="url(#a)"/><text x="800" y="361" font-size="10">REPLACED_BY</text>
    <line x1="1040" y1="370" x2="1118" y2="370" stroke="#166534" stroke-width="1.8" marker-end="url(#a)"/><text x="1080" y="361">PRICED_IN</text>
    <line x1="760" y1="510" x2="838" y2="510" stroke="#166534" stroke-width="1.8" marker-end="url(#a)"/><text x="800" y="501">REQUIRES</text>
  </g>
  <line x1="1220" y1="262" x2="1220" y2="336" stroke="#b91c1c" stroke-width="1.8" stroke-dasharray="5 4"/>
  <text x="1230" y="296" font-size="12" font-weight="700" fill="#b91c1c">no COVERS edge</text>
  <text x="1230" y="313" font-size="12" fill="#b91c1c">to category B</text>

  <rect x="1350" y="200" width="190" height="200" rx="10" fill="#fff" stroke="#bbf7d0"/>
  <text x="1366" y="226" font-size="13" font-weight="700" fill="#14532d">Answers</text>
  <text x="1366" y="252" font-size="12" fill="#166534">1. Swap 2210 for 2240</text>
  <text x="1366" y="278" font-size="12" fill="#166534">2. No 8% on 2240:</text>
  <text x="1366" y="295" font-size="12" font-weight="700" fill="#14532d">   $394 margin kept</text>
  <text x="1366" y="321" font-size="12" fill="#166534">3. Add 40 carriers:</text>
  <text x="1366" y="338" font-size="12" font-weight="700" fill="#14532d">   +$2,080 order value</text>
  <text x="1366" y="370" font-size="11.5" fill="#4b6355">every answer has a path</text>
  <text x="1366" y="386" font-size="11.5" fill="#4b6355">the eval can check</text>

  <rect x="560" y="580" width="980" height="110" rx="10" fill="#fff" stroke="#bbf7d0"/>
  <text x="580" y="608" font-size="13" font-weight="700" fill="#14532d">Evidence path sent to the eval</text>
  <text x="580" y="634" font-size="12.5" font-family="Menlo, monospace" fill="#166534">(:SKU 2210)-[:REPLACED_BY]-&gt;(:SKU 2240)-[:PRICED_IN]-&gt;(:Category B)</text>
  <text x="580" y="656" font-size="12.5" font-family="Menlo, monospace" fill="#166534">(:Contract 8%)-[:COVERS]-&gt;(:Category A)   // B not covered</text>
  <text x="580" y="678" font-size="12.5" font-family="Menlo, monospace" fill="#166534">(:SKU WM-FAUCET)-[:REQUIRES]-&gt;(:SKU CARRIER-7)</text>
</svg>
