# The whole application: `docker compose up --build` starts the databases, runs the one-shot setup (migrations,
# reference data, saved LLM output, demo quotes, graph), then the API, the correction worker and the web app.
# The web app is at http://localhost:5173 and the API at http://localhost:8000.
#
# For local development without containers for the app, start only the databases:
#   docker compose up -d postgres neo4j

x-backend-env: &backend-env
  DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/estimate_analysis
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: neo4j-dev-password
  # The settings loader needs a non-empty value. The setup and the demo never call either API, so these
  # placeholders are enough until you run a paid step; export real keys before `docker compose up` for that.
  OPENAI_API_KEY: ${OPENAI_API_KEY:-not-set}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-not-set}
  CORS_ALLOWED_ORIGINS: '["http://localhost:${WEB_PORT:-5173}"]'

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: estimate_analysis
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d estimate_analysis"]
      interval: 5s
      retries: 20

  neo4j:
    image: neo4j:2026.09.0-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/neo4j-dev-password
      NEO4J_PLUGINS: '["graph-data-science"]'
    ports:
      - "${NEO4J_HTTP_PORT:-17474}:7474"
      - "${NEO4J_BOLT_PORT:-17687}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p neo4j-dev-password 'RETURN 1'"]
      interval: 10s
      retries: 40
      # The first start downloads the graph plugin, which can take a few minutes.
      start_period: 60s

  init:
    build: ./backend
    command: python scripts/docker_init.py
    environment: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    restart: "no"

  api:
    build: ./backend
    environment: *backend-env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/metrics')"]
      interval: 5s
      retries: 20

  worker:
    build: ./backend
    command: python scripts/run_worker.py
    environment: *backend-env
    depends_on:
      init:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:${API_PORT:-8000}
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  neo4j_data:
